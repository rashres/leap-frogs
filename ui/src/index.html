<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LEAP Console</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f6fa" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235750f1'/%3E%3Cpath d='M7 21 L13 14 L18 18 L25 9' stroke='%23fff' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <!-- Applies the saved theme before first paint, so dark mode never flashes light. -->
    <script>
      try {
        if (localStorage.getItem('leap.ui.theme') === 'dark') document.documentElement.dataset['theme'] = 'dark';
      } catch {}
    </script>
  </head>
  <body>
    <leap-root></leap-root>
  </body>
</html>
