<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LilyPad Console</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f6fa" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+SC:wght@400;600;700&display=swap"
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 16 L21.92 3.31 A14 14 0 1 0 29.16 11.21 Z' fill='%234cb84a'/%3E%3Cpath d='M16 16 L28.22 11.55 A13 13 0 0 0 21.49 4.22 Z' fill='%238f8f8f' transform='translate(2.2 -1.4)'/%3E%3C/svg%3E" />
    <!-- Applies the theme before first paint, so dark mode never flashes light.
         A saved choice wins; otherwise follow the operating system. -->
    <script>
      var dark = false;
      try {
        var saved = localStorage.getItem('leap.ui.theme');
        dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      } catch {}
      if (dark) {
        document.documentElement.dataset['theme'] = 'dark';
        document.querySelector('meta[name="theme-color"]').content = '#000000';
      }
    </script>
  </head>
  <body>
    <leap-root></leap-root>
  </body>
</html>
