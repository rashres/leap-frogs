# Spring Boot Application Configuration

# Server Configuration
server.port=8081
server.servlet.context-path=/api

# Application Name
spring.application.name=leap-frogs-api

# Logging
logging.level.root=INFO
logging.level.com.neueda.leap=DEBUG

# Disable JPA auto-configuration for now (database connection will be configured when on VM)
spring.jpa.hibernate.ddl-auto=none
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# Database Configuration (Uncomment and update when connecting to PostgreSQL on VM)
# spring.datasource.url=jdbc:postgresql://localhost:5432/leapfrogs
# spring.datasource.username=postgres
# spring.datasource.password=password
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# spring.jpa.properties.hibernate.format_sql=true

# Springdoc OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
