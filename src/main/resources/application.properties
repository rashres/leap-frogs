# Spring Boot Application Configuration

# Server Configuration
server.port=8081
server.servlet.context-path=/api

# Application Name
spring.application.name=leap-frogs-api

# Logging
logging.level.root=INFO
logging.level.com.neueda.leap=DEBUG

# Database: operational DB (leapfrogsdb) in the Postgres container.
# Values come from the repo-root .env (shared with docker-compose and the ETL)
# or from OS environment variables. Never put the real password in this file.
spring.config.import=optional:file:./.env[.properties]
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:8100}/${DB_OPERATIONAL_NAME:leapfrogsdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.connection-timeout=5000

# MyBatis: map snake_case columns (account_id) to camelCase fields (accountId)
mybatis.configuration.map-underscore-to-camel-case=true

# Springdoc OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Price Update Scheduler Configuration
# Interval in milliseconds: 5000ms = 5 seconds
price.update.interval.ms=5000
price.update.enabled=true
