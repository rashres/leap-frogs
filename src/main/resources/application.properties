# Spring Boot Application Configuration

# Server Configuration
server.port=8081
server.servlet.context-path=/api

# Application Name
spring.application.name=leap-frogs-api

# Logging
logging.level.root=INFO
logging.level.com.neueda.leap=DEBUG

# Database: operational DB (leapfrogsdb) in the Postgres container.
# Values come from the repo-root .env (shared with docker-compose and the ETL)
# or from OS environment variables. Never put the real password in this file.
spring.config.import=optional:file:./.env[.properties]
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:8100}/${DB_OPERATIONAL_NAME:leapfrogsdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.connection-timeout=5000

# Reporting database (leap_analytics), filled by the ETL. Read-only from the API,
# so reporting never queries the live trading database.
analytics.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:8100}/${DB_ANALYTICS_NAME:leap_analytics}
analytics.datasource.username=${DB_USER:postgres}
analytics.datasource.password=${DB_PASSWORD:}

# MyBatis: map snake_case columns (account_id) to camelCase fields (accountId)
mybatis.configuration.map-underscore-to-camel-case=true

# Springdoc OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Price Update Scheduler Configuration
# Interval in milliseconds: 5000ms = 5 seconds
price.update.interval.ms=5000
price.update.enabled=true

# Trading hours (services/MarketHours.java). While a market is closed, orders
# wait as PENDING. false lets every market trade around the clock.
market.hours.enforced=true
# How often pending orders are checked for a fill or expiry.
orders.pending.enabled=true
orders.pending.interval.ms=15000
# Cash a trading account opened through sign-up starts with (USD).
signup.starting-cash=0
# How often copy stop-losses are checked against the latest prices.
copy.stoploss.enabled=true
copy.stoploss.interval.ms=60000

# Yahoo Finance (search, news fallback, daily volume). Unofficial endpoints, no key.
# Fresh answers are reused for cache-ttl; on a Yahoo failure, answers up to stale-limit old are served instead.
yahoo.base-url=https://query2.finance.yahoo.com
yahoo.timeout-ms=5000
yahoo.cache-ttl-seconds=120
yahoo.stale-limit-seconds=3600
