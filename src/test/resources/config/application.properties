# Test-only overrides, loaded on top of src/main/resources/application.properties
# (Spring Boot reads classpath:/config/ after classpath:/).
#
# Tests place orders at any hour and expect them to fill, so trading hours are
# off here; PendingOrderIntegrationTest turns them back on with a fixed clock.
market.hours.enforced=false
# The background fill job would touch real pending orders in the dev database.
orders.pending.enabled=false
# Disable external price refresh during tests so price-based assertions remain deterministic.
price.update.enabled=false
