version: '3.8'

services:
  # Single PostgreSQL Instance with both Operational and Analytics Databases
  postgres:
    image: postgres:16
    container_name: leap-frogs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: leapfrogsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - leap_frogs_postgres_data:/var/lib/postgresql/data
      # Initialize both databases in the same instance
      - ./database/capstone-mvp-schema.sql:/docker-entrypoint-initdb.d/001_capstone-mvp-schema.sql:ro
      - ./database/capstone-analytics-schema.sql:/docker-entrypoint-initdb.d/002_capstone-analytics-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  leap_frogs_postgres_data:
    driver: local
