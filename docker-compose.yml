services:
  postgres:
    image: postgres:16
    container_name: leap-frogs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-leapfrogsdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or your shell}
    ports:
      - "5432:5432"
    volumes:
      - leap_frogs_postgres_data:/var/lib/postgresql/data
      - ./database/capstone-mvp-schema.sql:/docker-entrypoint-initdb.d/001_capstone-mvp-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  leap_frogs_postgres_data:
