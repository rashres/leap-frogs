version: '3.8'

services:
  # Single PostgreSQL Instance with both Operational and Analytics Databases
  postgres:
    image: postgres:16
    container_name: leap-frogs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: leapfrogsdb
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "8100:5432"
    volumes:
      - leap_frogs_postgres_data:/var/lib/postgresql/data
      # First boot only (empty volume). Filenames 1-, 2-, 3- set run order.
      - ./database/create-analytics-database.sql:/docker-entrypoint-initdb.d/1-create-analytics-database.sql:ro
      - ./database/capstone-mvp-schema.sql:/docker-entrypoint-initdb.d/2-load-operational-schema.sql:ro
      - ./database/load-analytics-schema.sh:/docker-entrypoint-initdb.d/3-load-analytics-schema.sh:ro
      - ./database/capstone-analytics-schema.sql:/analytics-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Single-node Kafka broker (KRaft mode, no Zookeeper) for local dev/demo.
  # The Spring app runs on the host (see README), so it reaches this via localhost:9092.
  kafka:
    image: apache/kafka:3.8.0
    container_name: leap-frogs-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: BROKER://:9094,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: BROKER://kafka:9094,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: BROKER:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  # One-shot job: creates the trade.executed topic with 7-day retention, then exits.
  kafka-topic-init:
    image: apache/kafka:3.8.0
    container_name: leap-frogs-kafka-topic-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9094 --create --if-not-exists \
          --topic trade.executed --partitions 3 --replication-factor 1 \
          --config retention.ms=604800000

volumes:
  leap_frogs_postgres_data:
    driver: local