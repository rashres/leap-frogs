services:
  # Single PostgreSQL Instance with both Operational and Analytics Databases
  postgres:
    image: postgres:16
    container_name: leap-frogs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: leapfrogsdb
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8100:5432"
    volumes:
      - leap_frogs_postgres_data:/var/lib/postgresql/data
      # First boot only (empty volume). Filenames 1- to 3- set run order.
      - ./database/create-analytics-database.sql:/docker-entrypoint-initdb.d/1-create-analytics-database.sql:ro
      - ./database/capstone-mvp-schema.sql:/docker-entrypoint-initdb.d/2-load-operational-schema.sql:ro
      - ./database/load-analytics-schema.sh:/docker-entrypoint-initdb.d/3-load-analytics-schema.sh:ro
      - ./database/capstone-analytics-schema.sql:/analytics-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # yfinance price fetcher. Run on demand:
  #   docker compose run --rm price-fetcher
  # Not started by `docker compose up` - it is a task, not a service.
  price-fetcher:
    build:
      context: .
      dockerfile: etl/Dockerfile
    image: leap-frogs-etl
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_OPERATIONAL_NAME: leapfrogsdb
      DB_ANALYTICS_NAME: leap_analytics
    command: ["python", "price_fetcher.py"]

  # Full ETL run, same image:
  #   docker compose run --rm etl
  etl:
    build:
      context: .
      dockerfile: etl/Dockerfile
    image: leap-frogs-etl
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_OPERATIONAL_NAME: leapfrogsdb
      DB_ANALYTICS_NAME: leap_analytics
    command: ["python", "main.py"]

  # Kafka broker (KRaft, no ZooKeeper) for trade.executed events.
  # Keeps messages for 7 days (168 hours).
  kafka:
    image: apache/kafka:3.8.0
    container_name: leap-frogs-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: BROKER://:9094,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: BROKER://kafka:9094,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: BROKER:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  # One-shot job: creates the trade.executed topic with 7-day retention, then exits.
  kafka-topic-init:
    image: apache/kafka:3.8.0
    container_name: leap-frogs-kafka-topic-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9094 --create --if-not-exists \
          --topic trade.executed --partitions 3 --replication-factor 1 \
          --config retention.ms=604800000

volumes:
  leap_frogs_postgres_data:
    driver: local
