services:
  # Single PostgreSQL Instance with both Operational and Analytics Databases
  postgres:
    image: postgres:16
    container_name: leap-frogs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: leapfrogsdb
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8100:5432"
    volumes:
      - leap_frogs_postgres_data:/var/lib/postgresql/data
      # First boot only (empty volume). Filenames 1-, 2-, 3- set run order.
      - ./database/create-analytics-database.sql:/docker-entrypoint-initdb.d/1-create-analytics-database.sql:ro
      - ./database/capstone-mvp-schema.sql:/docker-entrypoint-initdb.d/2-load-operational-schema.sql:ro
      - ./database/load-analytics-schema.sh:/docker-entrypoint-initdb.d/3-load-analytics-schema.sh:ro
      - ./database/capstone-analytics-schema.sql:/analytics-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # yfinance price fetcher. Run on demand:
  #   docker compose run --rm price-fetcher
  # Not started by `docker compose up` - it is a task, not a service.
  price-fetcher:
    build:
      context: .
      dockerfile: etl/Dockerfile
    image: leap-frogs-etl
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_OPERATIONAL_NAME: leapfrogsdb
      DB_ANALYTICS_NAME: leap_analytics
    command: ["python", "price_fetcher.py"]

  # Full ETL run, same image:
  #   docker compose run --rm etl
  etl:
    build:
      context: .
      dockerfile: etl/Dockerfile
    image: leap-frogs-etl
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_OPERATIONAL_NAME: leapfrogsdb
      DB_ANALYTICS_NAME: leap_analytics
    command: ["python", "main.py"]

volumes:
  leap_frogs_postgres_data:
    driver: local
